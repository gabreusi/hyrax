name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:boundary

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The Node matrix runs the projects that need no browser. /dom is tested in Chromium below.
      - run: npm test

  browser:
    name: Browser tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Every project, browser included: this is where the coverage thresholds are enforced.
      - run: npm run test:coverage

  test-react-18:
    name: Test /react (React 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npx vitest run --project react
      # The source must also compile against the React 18 types, and the built package must work with them.
      - run: npx tsc -p tsconfig.react.json && npx tsc -p tsconfig.test.json
      - run: npm run build
      - run: node scripts/smoke.mjs
        env:
          HYRAX_SMOKE_REACT: 18

  build:
    name: Build and validate the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm run size
      - run: mkdir pack && npm pack --pack-destination pack
      # Dependencies are installed here, so this run also type-checks a consumer.
      - run: node scripts/smoke.mjs pack/*.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: pack/*.tgz
          if-no-files-found: error

  bundlers:
    name: Bundlers (esbuild, Vite, webpack)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: pack
      # Tree-shaking and size, as an app would bundle the installed package.
      - run: node scripts/smoke-bundlers.mjs pack/*.tgz

  docs:
    name: Docs (examples and site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The examples are checked against the built package.
      - run: npm run build
      - run: npm run docs:examples
      # Generates the API pages with TypeDoc, then builds the site. A dead link fails the build.
      - run: npm run docs:build

  smoke:
    name: Smoke test (Node ${{ matrix.node }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: pack
      - run: node scripts/smoke.mjs pack/*.tgz

  runtimes:
    name: Smoke test (Deno and Bun, best effort)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: tarball
          path: pack
      - run: node scripts/smoke.mjs pack/*.tgz
        env:
          HYRAX_SMOKE_RUNTIMES: deno,bun
