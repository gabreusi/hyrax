name: Docs

# Publishes the site to GitHub Pages. It does nothing until Pages is set to deploy from GitHub Actions
# (Settings > Pages > Source) and the repository variable DOCS_DEPLOY is set to "true", so that a
# repository that has not enabled Pages does not get a failing workflow on every push to main.
# The site is built and checked on every pull request by the `docs` job of ci.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the site
    if: ${{ vars.DOCS_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run docs:examples
      - run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v5
